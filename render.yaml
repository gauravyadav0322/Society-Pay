services:
  - type: web
    name: societypay
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: PAYMENT_MODE
        value: mock
